<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
<link rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <div class="container">
<div class="search-bar">
<input type="text" placeholder="Enter the city name...." spellcheck="false" id="city">
<button id="btn">
    <i class="fa-solid fa-magnifying-glass"></i>
</button>
</div>
<div class="weather">
<img src="https://img.magnific.com/premium-vector/weather-is-cloudy-sunny-clouds-sun_1115308-3.jpg?semt=ais_hybrid&w=740&q=80" alt="logo" class="weather-image">
<h1 class="temp">22 C</h1>
<h2 class="city">Baku</h2>
<div class="details">
<div class="cols">
<img src="https://thumbs.dreamstime.com/b/cartoon-blue-dripping-water-drop-splash-spray-tear-liquid-flow-wave-stream-puddle-nature-motion-shape-vector-illustration-320160742.jpg" alt="logo">
<div>
    <p class="humidity">50%</p>
    <p>Humidity</p>
</div>
</div>
<div class="cols">
<img src="https://i.graphicmama.com/resources/toons/cartoon-clouds/site-previews/siteBigWatermarkedImages/cartoon-clouds-simple-cartoon-cloud-clipart-20.jpg" alt="logo">
<div>
    <p class="wind">5km</p>
    <p>Wind Speed</p>
</div>
</div>
</div>
</div>
    </div>
    
    <script src="./main.js"></script>
</body>
</html>
