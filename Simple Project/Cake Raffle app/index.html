<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cake Raffle</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="container">

<h1>Cake Raffle</h1>

<div class="form">
<input
id="nameInput"
type="text"
placeholder="Enter your name">

<button id="addBtn">Enter</button>
</div>

<div class="info">
Participants:
<span id="count">0</span>
</div>

<ul id="list"></ul>

<div class="controls">
<button id="drawBtn">Draw</button>
<button id="resetBtn">Reset</button>
</div>

<div class="winner-card" id="winnerCard">
<h2>Winner </h2>
<div class="winner" id="winnerName"></div>
</div>

</div>

<script src="./script.js"></script>

</body>
</html>
